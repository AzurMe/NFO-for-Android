plugins {
    id 'com.android.application'
}

android {
    namespace 'org.kodiscraper.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'org.kodiscraper.app'
        minSdk 26
        targetSdk 35
        versionCode 26
        versionName '1.18.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
